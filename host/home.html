<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机器人上位机</title>
<style>body{background:#101724;color:#e8eef7;font:17px system-ui;margin:0}main{max-width:850px;margin:60px auto;padding:24px}a{display:block;background:#1a2638;color:#8bded0;border:1px solid #58708d;border-radius:12px;padding:24px;margin:20px 0;text-decoration:none}small,p{color:#b4c5da;line-height:1.8}h1{font-size:28px}</style>
<main><h1>机器人上位机</h1><a href="/motor"><b>轮速调参 / 持续行驶 →</b><p>PI参数、左右轮曲线、点击前进 / 后退持续运行、STOP与CSV日志</p></a><a href="http://127.0.0.1:8872/">视觉 / IMU 系统状态台 →</a><p id="link">正在检查控制链路…</p><small>PC通过Wi-Fi访问Nano网关时，FPGA串口仍须连接Nano。断开PC串口不等于自动切换为无线；页面须持续显示新鲜轮速反馈。</small></main>
<script>async function update(){try{const s=await(await fetch('/api/state')).json(),c=s.control||{};document.getElementById('link').textContent=s.gateway?.online&&c.motor_fresh?'控制链路在线 · 轮速反馈新鲜 · '+(c.phase==='stopped'?'已停机':'查看调参页状态'):'控制链路离线或反馈过期'}catch(e){document.getElementById('link').textContent='控制链路不可用'}setTimeout(update,500)}update()</script></html>
