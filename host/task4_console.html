<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>任务四 · 导航诊断台</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#dce6ed;background:#101820}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;border-bottom:1px solid #33434f;display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:22px;margin:0}small,.muted{color:#a5b6c3}button{background:#203d4e;color:white;border:1px solid #526779;border-radius:7px;padding:10px 15px;cursor:pointer}button:disabled{opacity:.4;cursor:default}#stop{background:#ae3441;font-weight:700}main{padding:20px 28px;max-width:1600px;margin:auto}.banner{padding:12px 16px;background:#273845;border-left:4px solid #6ac0d2;margin-bottom:18px}.warn{border-color:#f2bd63;background:#423720}.grid{display:grid;grid-template-columns:minmax(330px,1fr) minmax(400px,1.4fr);gap:18px}.panel{background:#18232d;border:1px solid #34434f;border-radius:10px;padding:18px;margin-bottom:18px}h2{font-size:16px;margin:0 0 14px}#checks>div{border-top:1px solid #30404c;padding:12px 0}#checks b{font-size:14px}#checks p{font-size:13px;margin:6px 0 0;color:#b7c6d0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:9px;background:#8d9eac}.dot.ok{background:#60d2ac}.dot.bad{background:#f58186}.dot.demo{background:#f0c565}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#22323f;padding:12px;border-radius:6px}.metric strong{display:block;font-size:21px;margin-top:6px}canvas{width:100%;height:320px;display:block;background:#111c25;border-radius:7px}textarea{width:100%;height:170px;background:#101b24;color:#d7e5ee;border:1px solid #4b5c6a;border-radius:5px;padding:10px;resize:vertical;font:12px monospace}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#b8cad7;max-height:280px;overflow:auto}summary{cursor:pointer;margin-bottom:10px}#events{height:190px;overflow:auto;font-size:13px}#events p{margin:8px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.editors{display:grid;grid-template-columns:1fr 1fr;gap:12px}a{color:#80cce1}#alert{color:#ffb2a8;white-space:pre-wrap;margin:12px 0}label{display:block;font-size:13px;margin-bottom:8px}@media(max-width:850px){.grid{grid-template-columns:1fr}header,main{padding:16px}.metrics{grid-template-columns:repeat(2,1fr)}.editors{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style>
<header><div><h1>任务四 · 导航诊断台</h1><small>FPGA → 位姿 / 路径点 / 避障许可 → 轮速控制</small></div><div class="row"><button id="export">导出诊断快照</button><button id="stop" disabled>STOP 停车</button></div></header>
<main><div id="banner" class="banner">正在连接本机诊断服务…</div><div id="alert" role="alert"></div>
<div class="grid"><section><div class="panel"><h2>逐层检查 · 从上往下定位</h2><div id="checks"></div></div><div class="panel"><h2>状态变化时间线</h2><div id="events"></div></div></section>
<section><div class="panel"><h2>导航状态 <small id="age"></small></h2><div class="metrics" id="metrics"></div><p class="muted" id="counts"></p><canvas id="plot" aria-label="相对里程计轨迹"></canvas><small>轨迹来自 FPGA 里程计；没有地图或外部定位。当前固件未上报雷达扇区，不绘制雷达扫描。</small></div>
<div class="panel"><details><summary>标定与路径点 · 离线校验 / 导出配置包</summary><p class="muted">这里只校验和下载配置，不发送 ARM、START 或运动命令。未标定项保持 null。</p><div class="editors"><div><label for="cal">实测标定 JSON</label><textarea id="cal"></textarea></div><div><label for="mission">路径点 JSON · mm</label><textarea id="mission">[{"x_mm":1000,"y_mm":0,"speed_mm_s":120}]</textarea></div></div><button id="prepare">校验并下载配置包</button><p id="prepared"></p></details></div>
<div class="panel"><details><summary>原始字段 / 故障上下文</summary><pre id="raw"></pre></details></div></section></div>
<p class="muted">实机串口由本服务独占。请先让原网关移交串口；不会自动断开其他程序、解锁电机或续租导航。</p></main>
<script>
const key='__KEY__';let latest=null;const el=id=>document.getElementById(id);
const pending={confirmed:false,wheel_diameter_mm:65,left_counts_per_rev:null,right_counts_per_rev:null,track_mm:null,robot_radius_mm:null,gyro_axis_sign:null,gyro_bias_raw:null,lidar_angle_offset_q100:null,lidar_reverse:null,parameters:{}};el('cal').value=JSON.stringify(pending,null,2);
function download(data,name,type){const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Task4-Key':key},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error);return j}
el('stop').onclick=async()=>{try{await post('/api/stop',{});el('alert').textContent='STOP 已发送；请确认电机遥测转为未 ARM。'}catch(e){el('alert').textContent=e.message}};
el('export').onclick=()=>{if(latest)download(JSON.stringify(latest,null,2),'task4-diagnostic.json','application/json')};
el('prepare').onclick=async()=>{try{const j=await post('/api/prepare',{calibration:JSON.parse(el('cal').value),mission:JSON.parse(el('mission').value)});const data=new Uint8Array(j.hex.match(/../g).map(x=>parseInt(x,16)));download(data,'task4-configuration.bin','application/octet-stream');el('prepared').textContent=j.packet_count+' 包；'+j.note;el('alert').textContent=''}catch(e){el('alert').textContent=e.message}};
function plot(s){const c=el('plot'),ctx=c.getContext('2d'),r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;ctx.scale(dpr,dpr);const w=r.width,h=r.height;let points=s.trace||[];let xs=[0,...points.map(p=>p[0])],ys=[0,...points.map(p=>p[1])];let minx=Math.min(...xs)-150,maxx=Math.max(...xs)+150,miny=Math.min(...ys)-150,maxy=Math.max(...ys)+150;const scale=Math.min((w-50)/(maxx-minx),(h-50)/(maxy-miny));const X=x=>25+(x-minx)*scale,Y=y=>h-25-(y-miny)*scale;ctx.strokeStyle='#304857';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(X(0),0);ctx.lineTo(X(0),h);ctx.moveTo(0,Y(0));ctx.lineTo(w,Y(0));ctx.stroke();ctx.strokeStyle=s.online?'#66d5b4':'#768999';ctx.lineWidth=2;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));ctx.stroke();if(points.length){const p=points[points.length-1],a=p[2]*Math.PI/180;ctx.fillStyle='#f4c479';ctx.beginPath();ctx.arc(X(p[0]),Y(p[1]),5,0,2*Math.PI);ctx.fill();ctx.beginPath();ctx.moveTo(X(p[0]),Y(p[1]));ctx.lineTo(X(p[0])+18*Math.cos(a),Y(p[1])-18*Math.sin(a));ctx.strokeStyle='#f4c479';ctx.stroke()}ctx.fillStyle='#adc1ce';ctx.font='12px sans-serif';ctx.fillText('起点 (0,0) · mm',10,17);if(s.mode==='demo')ctx.fillText('演示数据 · 非实车',w-150,17)}
function render(s){latest=s;const demo=s.mode==='demo',offline=s.mode==='offline';el('banner').className='banner'+(demo||!s.online?' warn':'');el('banner').textContent=demo?'演示模式：全部数值为合成数据，不代表车辆状态':offline?'离线模式：未连接硬件。使用 --serial 连接，或 --replay 回放记录':s.mode==='follow'?'实时跟随任务记录：不占用串口':s.mode==='replay'?'记录回放：'+(s.online?'按录制节奏播放':'已结束或遥测过期'):'实机只读诊断：'+(s.online?'导航遥测新鲜':'未收到新鲜导航遥测');el('stop').disabled=s.mode!=='live'||!!s.error;el('checks').replaceChildren();for(const ch of s.checks){const d=document.createElement('div'),b=document.createElement('b'),dot=document.createElement('span'),p=document.createElement('p');dot.className='dot '+ch.state;b.append(dot,document.createTextNode(ch.name));p.textContent=ch.detail;d.append(b,p);el('checks').append(d)}const n=s.rows.nav||{};el('metrics').replaceChildren();for(const [label,value] of [['路径点',n.waypoint_index===undefined?'—':n.waypoint_index+1],['前方距离',n.front_mm===undefined?'—':n.front_mm+' mm'],['线速度命令',n.v_mm_s===undefined?'—':n.v_mm_s+' mm/s'],['角速度命令',n.w_mrad_s===undefined?'—':n.w_mrad_s+' mrad/s'],['x',n.x_mm===undefined?'—':n.x_mm.toFixed(1)+' mm'],['y',n.y_mm===undefined?'—':n.y_mm.toFixed(1)+' mm'],['航向',n.heading_degrees===undefined?'—':n.heading_degrees.toFixed(1)+'°'],['输出许可',s.online?(n.permit?'允许':'禁止'):'未知 / 过期']]){const d=document.createElement('div');d.className='metric';const t=document.createElement('span'),v=document.createElement('strong');t.textContent=label;v.textContent=value;d.append(t,v);el('metrics').append(d)}el('age').textContent=s.ages_ms.nav===undefined?'':'· '+s.ages_ms.nav+' ms';el('counts').textContent='接收 '+s.bytes+' bytes · 导航坏帧 '+s.nav_bad_frames+' · 混流CRC错误 '+s.mixed_bad_crc+' · 规划 '+(n.plans??'—')+' · 雷达错误 '+(n.lidar_errors??'—')+' · 拒绝 '+(n.rejected??'—');el('events').replaceChildren();for(const e of [...s.events].reverse()){const p=document.createElement('p');p.textContent='+'+e.at_s+'s　'+e.message;el('events').append(p)}el('raw').textContent=JSON.stringify({mode:s.mode,ages_ms:s.ages_ms,rows:s.rows,recording:s.recording,error:s.error},null,2);if(s.error||s.recording_error)el('alert').textContent=s.error||s.recording_error;plot(s)}
async function poll(){try{const r=await fetch('/api/state');if(!r.ok)throw Error('HTTP '+r.status);render(await r.json())}catch(e){el('banner').textContent='诊断服务连接中断，界面状态不可作为当前状态';el('banner').className='banner warn';el('stop').disabled=true;el('alert').textContent=e.message}finally{setTimeout(poll,250)}}poll();
</script></html>
