<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>机器人感知集成台</title><style>
body{margin:0;background:#101827;color:#e6edf8;font:15px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1400px;margin:auto;padding:24px}h1{margin:0;font-size:26px}h2{font-size:18px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}#mode{color:#ffcf68}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}section{background:#1a2638;padding:18px;border-radius:10px;min-width:0}img{width:100%;max-height:390px;object-fit:contain;display:none}.image{min-height:220px;display:grid;place-items:center;background:#0b1220}.ok{color:#78e5ae}.bad{color:#ffba85}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px monospace}button{background:#314969;color:white;border:1px solid #6a85a7;padding:9px 13px;border-radius:5px;margin:4px;cursor:pointer}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{padding:14px;background:#111d2e;font-size:20px}small{font-size:12px;color:#b5c3d8}#notice{padding:12px;background:#29354a;margin-top:16px}#error{color:#ffba85}@media(max-width:800px){.grid{grid-template-columns:1fr}header{display:block}}
</style><main><header><div><h1>机器人感知集成台</h1><p>摄像头 · YOLO / LK · IMU · 双路图传</p></div><div><b id="mode">连接控制台…</b><p>电机输出固定关闭</p></div></header>
<div id="notice">离线状态不显示模拟实景。姿态仅用于观测，不用于电机控制。</div>
<div class="grid"><section><h2>PC直接图传 <span id="videoStatus"></span></h2><div class="image"><span id="cameraEmpty">无新鲜视频</span><img id="camera" alt="PC直接收到的摄像头画面"></div><pre id="video"></pre></section>
<section><h2>Nano实际推理帧 <span id="nanoStatus"></span></h2><div class="image"><span id="inferEmpty">无新鲜推理帧</span><img id="infer" alt="Nano反馈的实际推理帧"></div><pre id="detection"></pre><pre id="track"></pre></section>
<section><h2>IMU与姿态 <span id="imuStatus"></span></h2><div class="metrics"><div class="metric">俯仰 <b id="pitch">—</b>°</div><div class="metric">横滚 <b id="roll">—</b>°</div></div><p><small>传感器坐标：+Z直立，绕+X为横滚、绕+Y为俯仰；未标定为车体坐标。Yaw不可观测。</small></p><pre id="axes"></pre><pre id="imuHealth"></pre></section>
<section><h2>链路与记录</h2><p id="recording"></p><button data-api="/api/record/start">开始记录</button><button data-api="/api/record/stop">停止记录</button><button data-api="/api/save">保存当前图</button><button data-api="/api/shutdown">停止本控制台</button><p><small>记录10Hz状态与原始串口；视频逐帧保存由“保存当前图”触发。</small></p><p id="error" role="status"></p><pre id="health"></pre></section></div></main>
<script>
const $=id=>document.getElementById(id),fmt=n=>typeof n==='number'?n.toFixed(2):'—';let stopped=false;
function badge(id,on,detail=''){const e=$(id);e.textContent=(on?'在线':'离线 / 过期')+detail;e.className=on?'ok':'bad'}
function preview(id,empty,url,visible){$(id).style.display=visible?'block':'none';$(empty).style.display=visible?'none':'block';if(visible)$(id).src=url;else $(id).removeAttribute('src')}
function offline(){for(const id of ['videoStatus','nanoStatus','imuStatus'])badge(id,false);preview('camera','cameraEmpty','',false);preview('infer','inferEmpty','',false);$('pitch').textContent=$('roll').textContent='—';$('mode').textContent='控制台连接中断'}
async function update(){if(stopped)return;try{const r=await fetch('/api/state');if(!r.ok)throw Error(r.status);const s=await r.json();$('mode').textContent={offline:'离线 · 无硬件连接',demo:'模拟演示 · 非实板',live:'实时接收模式',replay:'历史回放 · 非实板'}[s.mode];$('notice').textContent=s.simulation?'当前所有演示输入均为模拟，不代表实板通过。':s.replay?'正在回放历史串口记录，视频与Nano保持离线。':'状态以数据新鲜度判断；历史数据保留供诊断。电机输出固定关闭。';badge('videoStatus',s.pc.online);preview('camera','cameraEmpty','/camera.jpg?t='+Date.now(),s.pc.online||s.simulation);$('video').textContent=JSON.stringify(s.pc,null,2);const n=s.nano.data||{},d=n.result||{};badge('nanoStatus',s.nano.result_fresh);preview('infer','inferEmpty','/infer.jpg?key='+encodeURIComponent(d.key||'')+'&t='+Date.now(),s.nano.result_fresh);$('detection').textContent='模型 '+(n.model||'—')+' / 推理FPS '+fmt(n.inference_fps)+'\n'+JSON.stringify(d.detections||[],null,2);$('track').textContent='LK '+(s.tracking.fresh?'新鲜':'过期 / 无数据')+'\n'+JSON.stringify(s.tracking.event,null,2);badge('imuStatus',s.imu.online&&s.imu.healthy);const a=s.imu.attitude,f=s.imu.frame||{},st=s.imu.statistics;$('pitch').textContent=a.valid?fmt(a.pitch_deg):'—';$('roll').textContent=a.valid?fmt(a.roll_deg):'—';$('axes').textContent='加速度(g) X '+fmt(f.ax_g)+'  Y '+fmt(f.ay_g)+'  Z '+fmt(f.az_g)+'\n角速度(°/s) X '+fmt(f.gx_dps)+'  Y '+fmt(f.gy_dps)+'  Z '+fmt(f.gz_dps);$('imuHealth').textContent='采集估计 '+fmt(st.raw_read_rate_hz)+' Hz / 调试 '+fmt(st.debug_rate_hz)+' Hz\nCRC错误 '+st.crc_failures+' / 序号缺口 '+st.serial_sequence_gaps+'\n'+(s.imu.error||'');$('recording').textContent=(s.recording.active?'记录中':'未记录')+' · '+(s.recording.path||'');$('health').textContent=JSON.stringify({mode:s.mode,video:s.pc.error,nano:s.nano.error,tracking:s.tracking.error,imu:s.imu.error,record:s.recording.error},null,2)}catch(e){if(!stopped){offline();$('error').textContent='连接失败：'+e}}finally{if(!stopped)setTimeout(update,200)}}
for(const b of document.querySelectorAll('[data-api]'))b.onclick=async()=>{try{const r=await fetch(b.dataset.api,{method:'POST'});const d=await r.json();$('error').textContent=r.ok?'操作完成':d.error;if(b.dataset.api==='/api/shutdown'&&r.ok){stopped=true;offline();$('mode').textContent='控制台已停止';$('error').textContent='已释放本控制台占用的资源'}}catch(e){$('error').textContent=String(e)}};update();
</script></html>
