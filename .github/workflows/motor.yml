name: System RTL and protocols
on: [push, pull_request]
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python -m pip install numpy opencv-python-headless pyserial
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python tools/test_system.py
      - run: python tools/test_perception.py
      - run: python tools/test_mailbox_contract.py
      - run: python tools/test_stable_cdc.py
      - run: node tests/test_perception_ui.js
      - run: node tests/test_ground_ui.js
      - run: node tests/test_motor_tuner_ui.js
      - run: node tests/test_imu_ui.js
